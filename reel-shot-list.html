<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Reel Shot List</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#14171b;background:#eef1f4;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
  .deck{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
  .screen{flex:0 0 100%;scroll-snap-align:start;height:100%;overflow:hidden;padding:9px 11px;display:flex}
  .card{flex:1;display:flex;flex-direction:column;background:#fff;border:1px solid #d5d9de;border-radius:15px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
  .hd{padding:11px 14px;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
  .hdrow{display:flex;align-items:center;gap:11px}
  .sc{font-weight:800;font-size:16px;line-height:1.1}
  .sc small{font-weight:500;font-size:12px;opacity:.85;display:block;margin-top:1px}
  .dursel{margin-left:auto;font-size:22px;font-weight:800;font-family:"Courier New",monospace;background:transparent;border:1px solid currentColor;border-radius:10px;padding:2px 6px;color:inherit}
  .linkline{display:flex;align-items:center;gap:9px}
  .lnkbtn{font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:18px;border:1px solid currentColor;background:rgba(255,255,255,.55);color:inherit;text-decoration:none}
  .lnkbtn.on{background:#fff}
  .lnkedit{font-size:12px;font-weight:600;background:transparent;border:none;color:inherit;opacity:.85;text-decoration:underline}
  .body{flex:1;display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 14px 12px}
  .grp{padding:8px 0;border-top:1px solid #eef0f2;flex-shrink:0}
  .grp:first-child{border-top:none}
  .gh{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:#454b53;font-weight:800;margin-bottom:6px}
  .gh.gtog{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .chev{font-size:12px;color:#9aa2ab}
  .grp.collapsed .gbody{display:none}
  .grp.collapsed .gh{margin-bottom:0}
  .fr{display:flex;gap:10px;align-items:center;padding:3px 0}
  .lab{flex:0 0 84px;font-size:14px;color:#20242a;font-weight:600}
  .shotinput{flex:1;min-height:34px;border:1px solid #d5d9de;background:#fff;border-radius:8px;padding:0 11px;font-size:14px;font-weight:500;font-family:inherit;color:#20242a}
  .sel{flex:1;height:36px;border:1px solid #d5d9de;border-radius:8px;padding:0 6px;font-size:13.5px;font-weight:500;background:#fff;color:#20242a}
  .selsm{flex:0 0 60px;height:30px}
  .selhalf{flex:0 1 40%}
  .mv{flex:1;display:flex;align-items:center;gap:6px;justify-content:flex-end;min-width:0}
  .lnkbtn2{font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:16px;border:1px solid #2f6fbf;background:#eaf1fb;color:#2f6fbf;text-decoration:none;white-space:nowrap}
  .lnkbtn2.on{background:#2f6fbf;color:#fff;border-color:#2f6fbf}
  .lnkedit2{font-size:11px;font-weight:600;background:transparent;border:none;color:#2f6fbf;text-decoration:underline}
  .chk{width:27px;height:27px;border:2px solid #9aa2ab;border-radius:6px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:#fff}
  .chk:active{transform:scale(.9)}
  .chk.on{border-color:#1a7f37;background:#e9f6ee}
  .chk.on::after{content:"\2713";color:#1a7f37;font-weight:800;font-size:18px}
  .frow{display:grid;grid-template-columns:repeat(4,1fr);align-items:center;column-gap:8px;padding:4px 0}
  .cc{justify-self:center}
  .flab{font-size:13.5px;font-weight:600;color:#20242a}
  .midlabels{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#20242a}
  .clipwrap{display:flex;align-items:center;gap:7px}
  .ostack{display:flex;flex-direction:column;align-items:center;gap:5px}
  .ostack .chk{width:25px;height:25px}
  .olab{font-size:11px;color:#20242a;font-weight:600}
  .mini{font-size:10px;color:#7a828b}
  .dirrow{align-items:flex-start}
  .dirbuild{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
  .seq{display:flex;flex-wrap:wrap;gap:6px;min-height:26px;align-items:center}
  .seqchip{font-size:12px;font-weight:700;color:#fff;background:#123E6E;border-radius:14px;padding:5px 10px;display:inline-flex;align-items:center;gap:6px}
  .seqchip b{opacity:.6}
  .seqempty{font-size:12px;color:#9aa2ab;font-style:italic}
  .dchips{display:flex;flex-wrap:wrap;gap:6px}
  .dchip{font-size:12px;font-weight:600;color:#454b53;background:#eef1f4;border:1px solid #e0e3e8;padding:6px 10px;border-radius:16px}
  .notes{width:100%;min-height:80px;border:1px solid #d5d9de;border-radius:9px;padding:8px 11px;font-size:14px;font-family:inherit;resize:none;background:#f7f8fa}
  .card.done .hd{background:#e9f6ee !important;color:#1a7f37 !important}
  .card.done .hd .dursel{color:#1a7f37 !important}
  .addscreen{flex:0 0 100%;scroll-snap-align:start;height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  .addbtn{border:2px dashed #b8bec6;background:#fff;color:#2f6fbf;font-size:17px;font-weight:800;padding:22px 26px;border-radius:16px;width:100%;max-width:340px}
  .bottom{flex-shrink:0;background:#fff;border-top:1px solid #e3e6eb;padding-bottom:env(safe-area-inset-bottom)}
  .progline{display:flex;align-items:center;gap:9px;padding:7px 14px 4px}
  .pbar{flex:1;height:6px;background:#e5e8ec;border-radius:6px;overflow:hidden}
  .pfill{height:100%;background:#1a7f37;width:0;transition:width .25s}
  .pcount{font-size:12px;color:#6b7280;font-weight:600;white-space:nowrap}
  .filters{display:flex;gap:7px;overflow-x:auto;padding:6px 14px;-webkit-overflow-scrolling:touch}
  .chip{flex:0 0 auto;font-size:13px;font-weight:600;color:#454b53;background:#eef1f4;border:1px solid #e0e3e8;padding:7px 14px;border-radius:20px;white-space:nowrap}
  .chip.act{background:#14171b;color:#fff;border-color:#14171b}
  .chip.home{background:#eaf1fb;color:#2f6fbf;border-color:#cfe0f5;font-weight:800}
  .botrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px 10px}
  .abtn{border:1px solid #e0e3e8;background:#f4f6f8;color:#20242a;font-size:13px;font-weight:700;padding:9px 13px;border-radius:11px}
  .nav{display:flex;align-items:center;gap:12px}
  .nav button{border:none;background:#eef1f4;width:38px;height:38px;border-radius:50%;font-size:19px;color:#20242a}
  .pos{font-size:13px;font-weight:700;min-width:104px;text-align:center}
  .overlay{position:fixed;inset:0;background:rgba(20,23,27,.55);display:none;align-items:flex-end;z-index:20}
  .overlay.show{display:flex}
  .sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:18px 18px calc(20px + env(safe-area-inset-bottom));max-height:78vh;overflow-y:auto}
  .sheet h3{margin:0 0 4px;font-size:17px}
  .sheet p{margin:0 0 14px;font-size:13px;color:#6b7280}
  .move{display:flex;align-items:center;justify-content:space-between;padding:13px 4px;border-bottom:1px solid #eef0f2;text-decoration:none;color:#14171b;font-weight:600;font-size:15px}
  .move span{color:#2f6fbf;font-size:13px;font-weight:700}
  .close{width:100%;margin-top:14px;padding:13px;border:none;background:#14171b;color:#fff;border-radius:12px;font-size:15px;font-weight:700}
  .home{position:fixed;inset:0;background:#eef1f4;z-index:30;display:none;flex-direction:column;padding:calc(18px + env(safe-area-inset-top)) 16px calc(18px + env(safe-area-inset-bottom))}
  .home.show{display:flex}
  .homehd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
  .homehd h2{margin:0;font-size:22px;font-weight:800}
  .xbtn{border:none;background:#e5e8ec;width:34px;height:34px;border-radius:50%;font-size:17px;color:#20242a}
  .homesub{font-size:13px;color:#6b7280;margin:0 0 16px}
  .homelist{flex:1;overflow-y:auto}
  .lrow{background:#fff;border:1px solid #e0e3e8;border-radius:14px;padding:13px 14px;margin-bottom:11px}
  .lopen{cursor:pointer}
  .lname{font-size:16px;font-weight:800}
  .lmeta{font-size:12.5px;color:#6b7280;margin-top:2px}
  .lacts{display:flex;gap:8px;margin-top:11px}
  .lacts button{flex:1;border:1px solid #e0e3e8;background:#f4f6f8;color:#20242a;font-size:12.5px;font-weight:700;padding:8px;border-radius:9px}
  .lacts button.del{color:#c0392b}
  .newlist{width:100%;border:2px dashed #b8bec6;background:#fff;color:#2f6fbf;font-size:15px;font-weight:800;padding:16px;border-radius:14px;margin-top:2px}
  .maxnote{text-align:center;color:#9aa2ab;font-size:13px;padding:12px}
</style>
</head>
<body>
  <div class="deck" id="deck"></div>
  <div class="bottom">
    <div class="progline"><div class="pbar"><div class="pfill" id="pfill"></div></div><span class="pcount" id="pcount">0/0</span></div>
    <div class="filters" id="filters"></div>
    <div class="botrow">
      <button class="abtn" onclick="uncheckAll()">Reset</button>
      <div class="nav"><button onclick="go(-1)">&#8249;</button><span class="pos" id="pos">—</span><button onclick="go(1)">&#8250;</button></div>
      <button class="abtn" onclick="openMoves()">How-to</button>
    </div>
  </div>

  <div class="home" id="home">
    <div class="homehd"><h2>My shot lists</h2><button class="xbtn" onclick="hideHome()">&#10005;</button></div>
    <p class="homesub">Pick a list to open, or make a new one. Up to 5.</p>
    <div class="homelist" id="homelist"></div>
  </div>

  <div class="overlay" id="overlay">
    <div class="sheet">
      <h3>Gimbal moves — how to</h3>
      <p>Tap a move for a tutorial. Or add your own video links per scene (shot look in the blue header, gimbal move beside Setting).</p>
      <div id="movelist"></div>
      <button class="close" onclick="closeMoves()">Done</button>
    </div>
  </div>
<script>
const CATS={
  money:{bg:'#E3EEFB',tx:'#123E6E'},closeup:{bg:'#FBEFCF',tx:'#785412'},drone:{bg:'#E7F1D8',tx:'#37560F'},
  hero:{bg:'#FBE2E0',tx:'#7C1E19'},pan:{bg:'#EDE9FB',tx:'#3B2C86'},other:{bg:'#EEF1F4',tx:'#3a4048'}
};
const BASE=[
 {id:1,n:'1',dur:'2s',cat:'money',name:'House',loc:'Exterior · Sony',lens:'12mm'},
 {id:2,n:'2',dur:'2s',cat:'drone',name:'House',loc:'Exterior · Drone',lens:'Drone'},
 {id:3,n:'3',dur:'1s',cat:'closeup',name:'House',loc:'Exterior · Sony',lens:'50mm'},
 {id:4,n:'4',dur:'4s',cat:'other',name:'Entrance',loc:'Interior · Main',lens:'12mm'},
 {id:5,n:'5',dur:'1s',cat:'other',name:'Door',loc:'Interior · Main',lens:'12mm'},
 {id:6,n:'6',dur:'1s',cat:'other',name:'Main floor',loc:'Interior · Main',lens:'12mm'},
 {id:7,n:'7',dur:'1s',cat:'closeup',name:'Detail',loc:'Interior · Main',lens:'50mm'},
 {id:8,n:'8–11',dur:'2s',cat:'closeup',name:'Rapid burst ×4',loc:'Interior · Main',lens:'50mm'},
 {id:12,n:'12',dur:'2s',cat:'other',name:'Main floor',loc:'Interior · Main',lens:'12mm'},
 {id:13,n:'13',dur:'1s',cat:'closeup',name:'Detail',loc:'Interior · Main',lens:'50mm'},
 {id:14,n:'14',dur:'1s',cat:'pan',name:'Pan',loc:'Interior · Main',lens:'12mm'},
 {id:15,n:'15',dur:'1s',cat:'closeup',name:'50mm detail',loc:'Interior · Main',lens:'50mm'},
 {id:16,n:'16',dur:'4s',cat:'hero',name:'FPV freeze / reverse',loc:'Interior · Main',lens:'12mm'},
 {id:17,n:'17',dur:'2s',cat:'money',name:'Family room',loc:'Interior · Main',lens:'12mm'},
 {id:18,n:'18',dur:'1s',cat:'closeup',name:'Dining detail',loc:'Interior · Main',lens:'50mm'},
 {id:19,n:'19',dur:'1s',cat:'other',name:'Dining',loc:'Interior · Main',lens:'12mm'},
 {id:20,n:'20',dur:'1s',cat:'closeup',name:'Detail',loc:'Interior · Main',lens:'50mm'},
 {id:21,n:'21',dur:'1s',cat:'closeup',name:'Stairs detail',loc:'Interior · Main',lens:'50mm'},
 {id:22,n:'22',dur:'1s',cat:'other',name:'Stairs',loc:'Interior · Main',lens:'12mm'},
 {id:23,n:'23',dur:'2s',cat:'money',name:'Master',loc:'Interior · Second',lens:'12mm'},
 {id:24,n:'24',dur:'1s',cat:'closeup',name:'Master detail',loc:'Interior · Second',lens:'50mm'},
 {id:25,n:'25',dur:'1s',cat:'closeup',name:'En suite detail',loc:'Interior · Second',lens:'50mm'},
 {id:26,n:'26',dur:'2s',cat:'other',name:'En suite',loc:'Interior · Second',lens:'12mm'},
 {id:27,n:'27',dur:'1s',cat:'other',name:'Bedroom',loc:'Interior · Second',lens:'12mm'},
 {id:28,n:'28',dur:'1s',cat:'other',name:'Bedroom',loc:'Interior · Second',lens:'12mm'},
 {id:29,n:'29',dur:'1s',cat:'other',name:'Bathroom',loc:'Interior · Second',lens:'12mm'},
 {id:30,n:'30',dur:'1s',cat:'other',name:'Bedroom',loc:'Interior · Second',lens:'12mm'},
 {id:31,n:'31',dur:'2s',cat:'money',name:'Basement',loc:'Interior · Basement',lens:'12mm'},
 {id:32,n:'32',dur:'2s',cat:'drone',name:'House',loc:'Exterior · Drone',lens:'Drone'},
 {id:33,n:'33',dur:'2s',cat:'drone',name:'House',loc:'Exterior · Drone',lens:'Drone'},
 {id:34,n:'34',dur:'2s',cat:'drone',name:'House',loc:'Exterior · Drone',lens:'Drone'},
 {id:35,n:'35',dur:'3s',cat:'drone',name:'House',loc:'Exterior · Drone',lens:'Drone'}
];
const MOVES=['Push in','Pull out','Pan','Tilt','Orbit','Reveal','Reverse / rewind','Crane up','Fly-through','Speed ramp'];
const LENSES=['Drone','12mm','24mm','50mm'];
const SETTINGS=['—','FPV','PF (pan follow)','PTF (pan-tilt)','360'];
const DIRS=['Push','Pull','Tilt up','Tilt down','Pan left','Pan right','Orbit left','Orbit right','Crane up','Crane down','Reveal'];
const CLIPS=['0','1','2','3','4','5'];
const TYPES=['Regular','Cool','Hero','Boss'];
const DURS=['0.5s','1s','1.5s','2s','2.5s','3s','3.5s','4s','4.5s','5s','5.5s','6s','6.5s','7s'];
const FILTERS=[['all','All'],['12mm','12mm'],['50mm','50mm'],['Drone','Drone'],['other','Other'],['agent','Agent']];
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const KEY='reelApp_v3';
let APP=null,filter='all';
function saveApp(){try{localStorage.setItem(KEY,JSON.stringify(APP))}catch(e){}}
function loadApp(){
  try{APP=JSON.parse(localStorage.getItem(KEY))}catch(e){APP=null}
  if(!APP||!APP.lists||!APP.order){
    let os={},oc=[];try{os=JSON.parse(localStorage.getItem('reelShotList')||'{}')}catch(e){}
    try{oc=JSON.parse(localStorage.getItem('reelCustomScenes')||'[]')}catch(e){}
    APP={currentId:'std',order:['std'],collapsed:{},lists:{std:{name:'Standard reel',scenes:BASE.concat(oc),state:os}}};
    saveApp();
  }
  if(!APP.collapsed)APP.collapsed={};
}
function cur(){return APP.lists[APP.currentId];}
function scenes(){return cur().scenes;}
function st(id){const s=cur().state;if(!s[id])s[id]={cap:false,type:'',flags:{},clip:'0',lens:'',setting:'—',dirs:[],notes:'',link:'',movelink:'',shot:null,dur:null};return s[id];}
function save(){saveApp();}
function iscol(sec){return !!APP.collapsed[sec];}
function buildFilters(){
  const f=document.getElementById('filters');
  f.innerHTML='<div class="chip home" data-home="1">&#8962; Home</div>'+FILTERS.map(([v,l])=>'<div class="chip'+(v===filter?' act':'')+'" data-f="'+v+'">'+l+'</div>').join('');
  f.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{if(ch.dataset.home){showHome();return;}filter=ch.dataset.f;buildFilters();applyFilter();});
}
function effLens(s){const d=st(s.id);return d.lens||s.lens;}
function matches(s){const e=effLens(s);if(filter==='all')return true;if(filter==='agent')return !!s.agent;if(filter==='other')return ['12mm','50mm','Drone'].indexOf(e)<0;return e===filter;}
function cardHTML(s){
  const c=CATS[s.cat]||CATS.other;const d=st(s.id);
  const done=d.cap?' done':'';
  const typeRow=TYPES.map(t=>'<div class="ostack"><div class="chk'+(d.type===t?' on':'')+'" data-act="type" data-id="'+s.id+'" data-v="'+t+'"></div><span class="olab">'+t+'</span></div>').join('');
  const durSel='<select class="dursel" data-act="dur" data-id="'+s.id+'">'+DURS.map(o=>'<option'+((d.dur||s.dur)===o?' selected':'')+'>'+o+'</option>').join('')+'</select>';
  const link=(d.link&&d.link.length)?'<a class="lnkbtn on" href="'+esc(d.link)+'" target="_blank" rel="noopener">&#9654; Watch shot</a><button class="lnkedit" data-act="linkedit" data-id="'+s.id+'">Edit</button>':'<button class="lnkbtn" data-act="linkadd" data-id="'+s.id+'">+ Add shot video</button>';
  const movelink=(d.movelink&&d.movelink.length)?'<a class="lnkbtn2 on" href="'+esc(d.movelink)+'" target="_blank" rel="noopener">&#9654; Move</a><button class="lnkedit2" data-act="mvedit" data-id="'+s.id+'">Edit</button>':'<button class="lnkbtn2" data-act="mvadd" data-id="'+s.id+'">+ Video</button>';
  const lensSel='<select class="sel" data-act="lens" data-id="'+s.id+'">'+LENSES.map(o=>'<option'+((d.lens||s.lens)===o?' selected':'')+'>'+o+'</option>').join('')+'</select>';
  const setSel='<select class="sel selhalf" data-act="setting" data-id="'+s.id+'">'+SETTINGS.map(o=>'<option'+((d.setting||'—')===o?' selected':'')+'>'+o+'</option>').join('')+'</select>';
  const clipSel='<select class="sel selsm" data-act="clip" data-id="'+s.id+'">'+CLIPS.map(o=>'<option'+((d.clip||'0')===o?' selected':'')+'>'+o+'</option>').join('')+'</select>';
  const shotVal=esc(d.shot!==null&&d.shot!==undefined?d.shot:s.name);
  const seq=(d.dirs&&d.dirs.length)?d.dirs.map((m,i)=>'<span class="seqchip" data-act="dirdel" data-id="'+s.id+'" data-i="'+i+'"><b>'+(i+1)+'</b>'+m+' &#215;</span>').join(''):'<span class="seqempty">tap moves below to build the sequence</span>';
  const palette=DIRS.map(m=>'<span class="dchip" data-act="diradd" data-id="'+s.id+'" data-m="'+m+'">'+m+'</span>').join('');
  function chev(sec){return '<span class="chev">'+(iscol(sec)?'\u25B8':'\u25BE')+'</span>';}
  return '<div class="card'+done+'">'
   +'<div class="hd" style="background:'+c.bg+';color:'+c.tx+'">'
     +'<div class="hdrow"><div class="chk'+(d.cap?' on':'')+'" data-act="cap" data-id="'+s.id+'"></div>'
       +'<div><div class="sc">Scene '+s.n+'</div><small>'+(s.loc||'&nbsp;')+'</small></div>'+durSel+'</div>'
     +'<div class="linkline">'+link+'</div>'
   +'</div>'
   +'<div class="body">'
     +'<div class="grp'+(iscol('type')?' collapsed':'')+'"><div class="gh gtog" data-act="collapse" data-sec="type">Shot type'+chev('type')+'</div><div class="gbody">'
       +'<div class="frow">'+typeRow+'</div>'
       +'<div class="frow"><div class="chk cc'+(d.flags.ramp?' on':'')+'" data-act="flag" data-id="'+s.id+'" data-k="ramp"></div><div class="flab" style="grid-column:2/5">Speed ramp</div></div>'
       +'<div class="frow"><div class="chk cc'+(d.flags.combo?' on':'')+'" data-act="flag" data-id="'+s.id+'" data-k="combo"></div><div class="flab clipwrap" style="grid-column:2/5"><span>Ramp combo</span><span class="mini">clip #</span>'+clipSel+'</div></div>'
       +'<div class="frow"><div class="chk cc'+(d.flags.fwd?' on':'')+'" data-act="flag" data-id="'+s.id+'" data-k="fwd"></div><div class="midlabels" style="grid-column:2/4"><span>Forward reverse</span><span>Date night</span></div><div class="chk cc'+(d.flags.date?' on':'')+'" style="grid-column:4" data-act="flag" data-id="'+s.id+'" data-k="date"></div></div>'
     +'</div></div>'
     +'<div class="grp">'
       +'<div class="fr"><div class="lab">Lens</div>'+lensSel+'</div>'
       +'<div class="fr"><div class="lab">Shot</div><input class="shotinput" data-act="shot" data-id="'+s.id+'" value="'+shotVal+'" placeholder="what the shot is of"></div>'
     +'</div>'
     +'<div class="grp'+(iscol('gimbal')?' collapsed':'')+'"><div class="gh gtog" data-act="collapse" data-sec="gimbal">Gimbal'+chev('gimbal')+'</div><div class="gbody">'
       +'<div class="fr"><div class="lab">Setting</div>'+setSel+'<div class="mv">'+movelink+'</div></div>'
       +'<div class="fr dirrow"><div class="lab">Direction</div><div class="dirbuild"><div class="seq">'+seq+'</div><div class="dchips">'+palette+'</div></div></div>'
     +'</div></div>'
     +'<div class="grp'+(iscol('notes')?' collapsed':'')+'"><div class="gh gtog" data-act="collapse" data-sec="notes">Notes'+chev('notes')+'</div><div class="gbody"><textarea class="notes" data-act="notes" data-id="'+s.id+'" placeholder="Tap to add a note...">'+(d.notes||'')+'</textarea></div></div>'
   +'</div></div>';
}
function rerender(){const deck=document.getElementById('deck');const dl=deck.scrollLeft;render();deck.scrollLeft=dl;}
function render(){
  const deck=document.getElementById('deck');
  deck.innerHTML=scenes().map(s=>'<div class="screen" data-id="'+s.id+'">'+cardHTML(s)+'</div>').join('')
    +'<div class="addscreen"><button class="addbtn" onclick="addScene()">+ Add scene</button></div>';
  deck.querySelectorAll('[data-act]').forEach(el=>{
    const a=el.dataset.act,id=el.dataset.id;
    if(a==='cap')el.onclick=()=>{const d=st(id);d.cap=!d.cap;save();el.classList.toggle('on',d.cap);el.closest('.card').classList.toggle('done',d.cap);updateProg();};
    if(a==='type')el.onclick=()=>{const d=st(id);d.type=(d.type===el.dataset.v?'':el.dataset.v);save();el.closest('.frow').querySelectorAll('.chk').forEach(x=>x.classList.toggle('on',x.dataset.v===d.type));};
    if(a==='flag')el.onclick=()=>{const d=st(id);d.flags[el.dataset.k]=!d.flags[el.dataset.k];save();el.classList.toggle('on',d.flags[el.dataset.k]);};
    if(a==='lens')el.onchange=()=>{st(id).lens=el.value;save();applyFilter();};
    if(a==='setting')el.onchange=()=>{st(id).setting=el.value;save();};
    if(a==='clip')el.onchange=()=>{st(id).clip=el.value;save();};
    if(a==='dur')el.onchange=()=>{st(id).dur=el.value;save();};
    if(a==='shot')el.oninput=()=>{st(id).shot=el.value;save();};
    if(a==='diradd')el.onclick=()=>{const d=st(id);d.dirs=d.dirs||[];d.dirs.push(el.dataset.m);save();rerender();};
    if(a==='dirdel')el.onclick=()=>{const d=st(id);d.dirs.splice(+el.dataset.i,1);save();rerender();};
    if(a==='notes')el.oninput=()=>{st(id).notes=el.value;save();};
    if(a==='collapse')el.onclick=()=>{APP.collapsed[el.dataset.sec]=!APP.collapsed[el.dataset.sec];saveApp();rerender();};
    if(a==='linkadd')el.onclick=()=>{const u=prompt('Paste a video link showing what this SHOT should look like:');if(u&&u.trim()){st(id).link=u.trim();save();rerender();}};
    if(a==='linkedit')el.onclick=()=>{const u=prompt('Edit the shot video link (clear to remove):',st(id).link||'');if(u!==null){st(id).link=u.trim();save();rerender();}};
    if(a==='mvadd')el.onclick=()=>{const u=prompt('Paste the GIMBAL-MOVEMENT tutorial link for this scene:');if(u&&u.trim()){st(id).movelink=u.trim();save();rerender();}};
    if(a==='mvedit')el.onclick=()=>{const u=prompt('Edit the gimbal-move video link (clear to remove):',st(id).movelink||'');if(u!==null){st(id).movelink=u.trim();save();rerender();}};
  });
  applyFilter();
}
function addScene(){
  const ids=scenes().map(x=>parseInt(String(x.id),10)).filter(n=>!isNaN(n));
  const nid=Math.max(35,...ids)+1;
  cur().scenes.push({id:nid,n:String(nid),dur:'2s',cat:'other',name:'',loc:'',lens:'12mm'});
  saveApp();
  const deck=document.getElementById('deck');render();deck.scrollLeft=deck.scrollWidth;
}
function visibleScreens(){return [...document.querySelectorAll('.screen')].filter(s=>s.style.display!=='none');}
function applyFilter(){
  const byId={};scenes().forEach(s=>byId[s.id]=s);
  document.querySelectorAll('.screen').forEach(sc=>{const s=byId[sc.dataset.id];sc.style.display=(s&&matches(s))?'':'none';});
  updateProg();updatePos();
}
function updateProg(){
  const vis=visibleScreens();const total=vis.length;
  const cap=vis.filter(s=>st(s.dataset.id).cap).length;
  document.getElementById('pfill').style.width=(total?cap/total*100:0)+'%';
  document.getElementById('pcount').textContent=cap+'/'+total+(total&&cap===total?' \u2713':'');
}
function updatePos(){
  const vis=visibleScreens();if(!vis.length){document.getElementById('pos').textContent='—';return;}
  const deck=document.getElementById('deck');
  const cur2=Math.min(Math.round(deck.scrollLeft/deck.clientWidth),vis.length-1);
  const s=vis[cur2];const sc=scenes().find(x=>x.id==s.dataset.id);
  document.getElementById('pos').textContent='Scene '+(sc?sc.n:'?')+' · '+(cur2+1)+'/'+vis.length;
}
document.getElementById('deck').addEventListener('scroll',()=>{clearTimeout(window._t);window._t=setTimeout(updatePos,60)});
function go(dir){const deck=document.getElementById('deck');deck.scrollBy({left:dir*deck.clientWidth,behavior:'smooth'});}
function uncheckAll(){if(!confirm('Uncheck everything in "'+cur().name+'" for a fresh shoot? (Clears check-offs, selections, notes. Added scenes stay.)'))return;cur().state={};saveApp();render();}
function openMoves(){document.getElementById('movelist').innerHTML=MOVES.map(m=>{const q=encodeURIComponent(m+' gimbal shot real estate tutorial');return '<a class="move" href="https://www.youtube.com/results?search_query='+q+'" target="_blank" rel="noopener">'+m+'<span>Watch &#9656;</span></a>';}).join('');document.getElementById('overlay').classList.add('show');}
function closeMoves(){document.getElementById('overlay').classList.remove('show');}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeMoves();});
/* ---- homepage / lists ---- */
function capCount(L){return Object.keys(L.state||{}).filter(k=>L.state[k]&&L.state[k].cap).length;}
function showHome(){renderHome();document.getElementById('home').classList.add('show');}
function hideHome(){document.getElementById('home').classList.remove('show');}
function renderHome(){
  const w=document.getElementById('homelist');
  w.innerHTML=APP.order.map(id=>{const L=APP.lists[id];
    return '<div class="lrow"><div class="lopen" data-h="open" data-id="'+id+'"><div class="lname">'+esc(L.name)+(id===APP.currentId?' <span style="font-size:12px;color:#2f6fbf">(open)</span>':'')+'</div><div class="lmeta">'+L.scenes.length+' scenes · '+capCount(L)+' captured</div></div>'
      +'<div class="lacts"><button data-h="dup" data-id="'+id+'">Duplicate</button><button data-h="ren" data-id="'+id+'">Rename</button>'+(APP.order.length>1?'<button class="del" data-h="del" data-id="'+id+'">Delete</button>':'')+'</div></div>';
  }).join('') + (APP.order.length<5?'<button class="newlist" data-h="new">+ New list</button>':'<div class="maxnote">Maximum of 5 lists reached</div>');
  w.querySelectorAll('[data-h]').forEach(el=>{
    const h=el.dataset.h,id=el.dataset.id;
    if(h==='open')el.onclick=()=>{APP.currentId=id;saveApp();filter='all';hideHome();buildFilters();render();document.getElementById('deck').scrollLeft=0;};
    if(h==='dup')el.onclick=()=>{if(APP.order.length>=5){alert('Max 5 lists.');return;}const L=APP.lists[id];const nid='l'+Date.now();const cp=JSON.parse(JSON.stringify(L));cp.name=L.name+' copy';Object.keys(cp.state||{}).forEach(k=>{if(cp.state[k])cp.state[k].cap=false;});APP.lists[nid]=cp;APP.order.push(nid);saveApp();renderHome();};
    if(h==='ren')el.onclick=()=>{const n=prompt('Rename list:',APP.lists[id].name);if(n!==null){APP.lists[id].name=n.trim()||APP.lists[id].name;saveApp();renderHome();}};
    if(h==='del')el.onclick=()=>{if(!confirm('Delete "'+APP.lists[id].name+'"? This cannot be undone.'))return;delete APP.lists[id];APP.order=APP.order.filter(x=>x!==id);if(APP.currentId===id)APP.currentId=APP.order[0];saveApp();renderHome();buildFilters();render();};
    if(h==='new')el.onclick=()=>{if(APP.order.length>=5)return;const n=prompt('Name this list (starts from the Standard template):','New list');if(n===null)return;const nid='l'+Date.now();APP.lists[nid]={name:n.trim()||'New list',scenes:JSON.parse(JSON.stringify(BASE)),state:{}};APP.order.push(nid);saveApp();renderHome();};
  });
}
loadApp();buildFilters();render();
</script>
</body>
</html>
