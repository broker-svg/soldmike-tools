<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}.move video[src*="15_hurley_special_operator"]{object-fit:contain;background:#000}
.alltabs{display:inline-flex;align-items:center;gap:8px;margin:0 0 12px}
.mvbig{margin:auto 0;padding:12px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.mvbig .mvn{font-weight:800;font-size:20px;line-height:1.15;color:var(--gold);letter-spacing:.01em}
.mvbig .mvd{font-size:12px}
.cfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
.cfoot .capt{margin-top:0;padding-top:0;border-top:0}
.cfoot .sblink{padding:0;text-align:right}
.card .line.nm{font-weight:700;font-size:13.5px;color:var(--fg)}
.card.inc{outline:3px solid var(--cc,var(--gold));outline-offset:3px}
.card.inc .cband{background:var(--cc,var(--gold))}
.cfoot{flex-wrap:wrap}
.cmbt input{accent-color:var(--gold)}
.sheet.story{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px 10px}
.sheet.story.v{grid-template-columns:repeat(auto-fill,minmax(104px,1fr))}
.sbm .mcap{padding:5px 2px 0;font-size:12px;line-height:1.25}
.sbm .mcap b{display:block;font-weight:700;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbm .mcap span{display:block;color:var(--gold);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbm .mcap i{font-style:normal}
.mini.inc{outline:2px solid var(--cc,var(--gold));outline-offset:3px;border-radius:4px}
.mini.drag{opacity:.4}.mini.over{outline:2px dashed #fff;outline-offset:3px}
.beatlab{grid-column:1/-1;display:flex;gap:10px;align-items:baseline;font:600 11px var(--mono);color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-top:8px;padding-bottom:3px;border-bottom:1px solid var(--line)}
.beatlab small{color:var(--dim);font-size:10.5px}
.sect small{font-weight:400;color:var(--dim);text-transform:none;letter-spacing:0}
.sbm .cmbt{margin-top:4px;padding-top:4px;font-size:11.5px;gap:6px}
.sbm .cmbt input{width:16px;height:16px}
.sbm{cursor:pointer}
.cband{align-items:center}
.cundo{font:700 10.5px var(--mono);color:#17120a;background:#ffffffa8;border-radius:4px;padding:3px 7px;cursor:pointer}
.cundo:hover{background:#fff}
.cundo.sm{display:block;margin-top:4px;background:transparent;color:var(--cc,var(--gold));border:1px solid var(--cc,var(--gold));padding:2px 6px}
.card.hid{opacity:.5;filter:grayscale(.7)}
.card.hid:hover{opacity:.85}
.hidt input{accent-color:#8a96a3}
.delb{margin-left:auto;font:600 11.5px var(--mono);color:var(--mut);border:1px solid var(--line);border-radius:4px;padding:3px 8px;cursor:pointer}
.delb:hover{color:#fff;border-color:#c0504d}
.delb.armed{color:#fff;background:#b8403c;border-color:#b8403c}
.showhid{display:inline-flex;gap:7px;align-items:center;margin:0 0 12px 16px;font-size:13px;font-weight:700;cursor:pointer}
.showhid input{width:18px;height:18px}
.legend .lc{font:800 12.5px var(--mono);color:var(--fg);margin-left:3px}
.legend .lt{font:700 12px var(--mono);color:var(--gold)}
.tplu{border-color:var(--gold);color:var(--gold)}
.tplu b{background:var(--gold);color:#17120a;border-radius:9px;padding:1px 7px;margin-left:4px;font-size:11px}
.tplu.armed{background:var(--gold);color:#17120a}
.pick{background:var(--panel);border:1px solid var(--gold);border-radius:10px;padding:12px 14px;margin:0 0 14px}
.pickhd{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pickhd b{font-size:16px;color:var(--gold);margin-right:4px}
.pickhd input{flex:1 1 240px;min-width:180px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:inherit;font-size:14px}
.pickinfo{font-size:12px;color:var(--dim);margin:8px 0 10px}
.pg{border-top:1px solid var(--line)}
.pg summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 2px;font-weight:700}
.pg summary::-webkit-details-marker{display:none}
.pg summary small{background:var(--panel2);border-radius:9px;padding:1px 8px;font-weight:600;color:var(--dim)}
.pg summary .car{margin-left:auto;color:var(--dim);transition:transform .15s}
.pg[open] summary .car{transform:rotate(180deg)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;padding:0 0 12px}
.pki{position:relative;display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px 6px 10px;cursor:pointer;color:inherit;font:inherit;overflow:hidden}
.pki:hover{border-color:var(--gold)}
.pki .pkbar{position:absolute;left:0;top:0;bottom:0;width:4px}
.pki img,.pki .pknoimg{width:64px;height:40px;object-fit:cover;border-radius:4px;flex:none;background:#0003}
.pki .pkt{display:flex;flex-direction:column;min-width:0}
.pki .pkt b{font-size:13px;line-height:1.2}
.pki .pkt small{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pki .pkt em{font-size:10px;font-style:normal;color:var(--gold)}
.legend .ls{color:var(--dim);font-size:11px}
.lgd{position:relative;display:inline-block}
.lgd summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--line);border-radius:14px}
.lgd summary::-webkit-details-marker{display:none}
.lgd summary:hover,.lgd[open] summary{border-color:var(--gold)}
.lgd .car{font-size:10px;color:var(--dim)}
.lgd .dd{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:300px;max-height:420px;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 10px 30px #000a}
.ddg{padding:4px 0 6px}
.ddg>b{display:flex;justify-content:space-between;font:700 11px var(--mono);color:var(--gold);text-transform:uppercase;letter-spacing:.05em;padding:4px 0;border-bottom:1px solid var(--line);margin-bottom:3px}
.ddi{display:grid;grid-template-columns:34px 1fr auto;gap:6px;width:100%;text-align:left;padding:4px 2px;font-size:13px;color:var(--fg);border-radius:4px;cursor:pointer}
.ddi:hover{background:#ffffff10}
.ddi span{font:600 11px var(--mono);color:var(--dim)}
.ddi em{font-style:normal;font-size:11px;color:var(--mut)}
.lgd .dd{max-height:none;overflow:visible}
.lgd .dd.two{columns:2;column-gap:22px;width:min(720px,calc(100vw - 300px))}
.ddg{break-inside:avoid}
.seglab{font:500 10.5px var(--mono);color:var(--dim);text-transform:uppercase;letter-spacing:.05em}
.rowsub{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.jump button{border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;background:var(--panel)}
.jump small{font:500 11px var(--mono);color:var(--dim);margin-left:4px}
.shootboard{padding:14px}
.shootcard.got{opacity:.55}
.capt{display:flex;align-items:center;gap:8px;margin-top:6px;padding-top:7px;border-top:1px solid var(--line);font-weight:700;font-size:13.5px;cursor:pointer}
.capt input{width:21px;height:21px;accent-color:var(--ok)}
.sblink{color:var(--gold);font-weight:700;text-align:left;text-decoration:underline;text-underline-offset:2px}
.row .sn.sblink{color:var(--gold)}
.card .sblink{font-size:13px;padding:5px 0 0}
@media(max-width:820px){.row{align-items:start;gap:2px 10px}.row>input{grid-column:1;grid-row:1/span 4}.row>.th{grid-column:2;grid-row:1/span 4}.row>.sn,.row>span{grid-column:3;text-align:left}}
.xtra{display:inline-block;background:var(--gold);color:#17120a;font:800 10px/1 var(--mono);padding:3px 5px;border-radius:3px;margin:0 5px 0 2px;vertical-align:1px}
.card .top .xtra{box-shadow:0 0 0 1px #17120a}
.tile.isx{box-shadow:inset 0 0 0 2px var(--gold)}
.used{color:var(--gold)!important;font:600 11.5px/1.3 var(--mono)!important}
</style></head><body>
<title>Storyboard Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;1,600&display=swap">
<style>
/* Layout: an edit suite. Library rail on the left, the board in the middle, shot inspector sliding in on the right. */
:root{
  color-scheme:dark;
  --ink:#0c1620; --panel:#132230; --panel2:#1a2e40; --line:#27415a; --fg:#eaf0f5; --mut:#9db0c1; --dim:#70869a;
  --gold:#c9a04a; --navy:#1a4b6e; --ok:#46c46f; --warn:#f2b632; --red:#e21e28;
  --disp:'Archivo',system-ui,sans-serif; --body:'Archivo',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font:15px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.rail{background:var(--panel);border-right:1px solid var(--line);padding-block:18px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.logo{font:800 19px/1 var(--disp);font-stretch:85%;letter-spacing:.01em;text-transform:uppercase}
.logo span{display:block;font:500 11px/1.6 var(--mono);color:var(--gold);letter-spacing:.06em;text-transform:none}
.grp h4{margin:0 0 6px;font:600 11px/1.3 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
.grp .nest{padding-left:10px;border-left:1px solid var(--line);margin-left:4px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:6px 8px;border-radius:6px;color:var(--mut);font-size:14px}
.nav:hover{background:var(--panel2);color:var(--fg)}
.nav.on{background:var(--navy);color:#fff}
.nav small{font:500 11px var(--mono);color:var(--dim)}
.nav.on small{color:#cfe0ec}
.nav.sub{font-weight:600;color:var(--fg)}
.areas{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.areas button{padding:7px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;font-weight:600;color:var(--mut);background:var(--panel2)}
.areas button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.nav.newf{color:var(--gold);font-weight:600;margin-top:6px}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.armed{border-color:#ef4b43;color:#ef4b43}
.newfold{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:16px}
.newfold .fld{margin:0;width:260px}
.newfold input,.newfold select{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:7px 9px}
.fvs{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;width:100%;font-size:13px}.fvs>span{color:var(--mut);font-size:12px}
.fnote{width:100%;margin:0;font-size:12px;color:var(--mut)}.ferr{width:100%;color:#ef4b43;font-size:13px}.ferr:empty{display:none}
.facts{display:flex;gap:8px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.fcard{display:flex;flex-direction:column;gap:4px;text-align:left;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.fcard:hover{border-color:var(--gold)}.fcard .fr{aspect-ratio:16/10;overflow:hidden;border-radius:5px}.fcard .fr img{width:100%;height:100%;object-fit:cover}
.fcard b{font-size:14px}.fcard span{font-size:12px;color:var(--mut)}
.sbsw{overflow-x:auto;padding-bottom:6px}
.sbs{display:grid;gap:14px;align-items:start}
.sbc{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px;min-width:0}
.sbh{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;margin-bottom:8px}.sbh b{font-size:15px}.sbh small{font-size:12px;color:var(--mut)}
.sbt{display:flex;height:16px;gap:1px;border-radius:3px;overflow:hidden;margin-bottom:8px}
.sbl{display:flex;flex-direction:column;gap:2px}
.sbr{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:4px 6px;border-radius:5px;font-size:13px}.sbr:hover{background:var(--panel2)}
.sbk{width:4px;align-self:stretch;border-radius:2px;flex:none}.sbr em{font:500 11px var(--mono);color:var(--dim);font-style:normal;width:20px;flex:none}
.sbn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sbr small{font:11px var(--mono);color:var(--dim)}
.save{margin-top:auto;font:500 11px/1.4 var(--mono);color:var(--dim)}
.main{min-width:0;overflow:auto;padding-block:20px 60px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 20px;margin-bottom:14px}
.head h1{margin:0;font:800 34px/1.05 var(--disp);font-stretch:82%;text-wrap:balance}
.head .sub{color:var(--mut);font-size:14px;margin-top:4px}
.head .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:600;background:var(--panel)}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:#17120a}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tab{padding:9px 14px;font-weight:700;font-size:14px;color:var(--mut);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--fg);border-bottom-color:var(--gold)}
.flag{display:flex;gap:9px;align-items:flex-start;background:#2c2412;border:1px solid #5b4a1e;color:#f6e3b0;border-radius:6px;padding:7px 11px;font-size:13px;margin-bottom:8px}
.flag b{color:var(--warn);font:600 11px/1.7 var(--mono);white-space:nowrap}

/* Stats + legend */
.stats{display:flex;flex-wrap:wrap;gap:6px 26px;margin:10px 0 16px}
.stat b{display:block;font:600 21px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat b.over{color:var(--warn)}
.stat span{font-size:12px;color:var(--mut)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin:0 0 12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hatch{background:repeating-linear-gradient(135deg,#fff 0 2px,transparent 2px 5px),#34506a}

/* Bird's-eye timeline */
.tlwrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:20px}
.tl{min-width:860px;position:relative}
.lane{position:relative;height:22px;margin-bottom:4px}
.lane .seg{position:absolute;top:0;bottom:0;overflow:hidden;white-space:nowrap;font:600 11px/22px var(--mono);padding:0 6px;color:var(--mut);border-left:1px solid var(--line)}
.lane.combos{height:20px}
.lane.combos .seg{background:#0f1c29;border:1.5px solid var(--gold);border-radius:10px;color:var(--gold);line-height:17px;text-align:center}
.tiles{display:flex;height:66px;gap:1px;margin-bottom:4px}
.tile{position:relative;min-width:3px;border-radius:2px;color:#0c1620;overflow:hidden;font:600 11px/1 var(--mono);padding:4px 3px;text-align:left}
.tile:hover{filter:brightness(1.15)}
.tile.sel{box-shadow:inset 0 0 0 2px #fff}
.tile.got::after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;background:#0c1620b0}
.tile .hd{position:absolute;top:0;bottom:0;width:7px;opacity:.55;background:repeating-linear-gradient(135deg,#0c1620 0 2px,transparent 2px 4px)}
.tile .hd.l{left:0}.tile .hd.r{right:0}
.rollrow{display:flex;height:5px;gap:1px;margin-bottom:6px}
.rollrow i{min-width:3px;background:var(--dim)}
.rollrow i.A{background:var(--gold)}
.ruler{position:relative;height:16px;font:500 10px/16px var(--mono);color:var(--dim)}
.ruler span{position:absolute;border-left:1px solid var(--line);padding-left:3px}
.sect{font:800 15px/1.2 var(--disp);font-stretch:88%;text-transform:uppercase;letter-spacing:.03em;margin:22px 0 10px;color:var(--fg)}

/* Contact sheet */
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.mini{position:relative;text-align:left;display:block;min-width:0}
.mini .bar{height:4px;border-radius:2px 2px 0 0}
.mini .n{position:absolute;top:8px;left:4px;font:600 10px var(--mono);background:#0c1620c9;padding:1px 4px;border-radius:3px;z-index:3}
.mini .ck{position:absolute;top:8px;right:4px;width:15px;height:15px;border-radius:50%;background:var(--ok);color:#06240f;font:800 10px/15px var(--mono);text-align:center;z-index:3}
.mini.sel .fr{box-shadow:0 0 0 2px #fff}
.mini .cl{position:absolute;right:-9px;top:44%;z-index:4}

/* Frame */
.fr{position:relative;aspect-ratio:9/16;width:100%;overflow:hidden;background:#101c28;container-type:inline-size;isolation:isolate}
.fr>svg.sc,.fr>img.real,.fr>video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fr>video.ct{object-fit:contain;background:#000}
.fr .tal{position:absolute;bottom:0;z-index:2;max-width:none;pointer-events:none}
.tal.w{width:66cqw;left:17cqw}
.tal.m{width:118cqw;left:-4cqw}
.tal.c{width:178cqw;left:-34cqw;bottom:-32cqw}
.bh{position:absolute;z-index:1;left:0;right:0;top:16cqw;text-align:center;color:#fff;line-height:.95;padding:0 3cqw}
.bh.serif{font:italic 600 19cqw/1 'Playfair Display',serif}
.bh.serifred{font:italic 600 24cqw/1 'Playfair Display',serif;color:var(--red)}
.bh.sans{font:400 15cqw/1 'Archivo Black',sans-serif;letter-spacing:-.01em}
.bh.stat{font:400 27cqw/1 'Archivo Black',sans-serif;text-shadow:0 0 5cqw var(--red),0 0 12cqw var(--red)}
.cap{position:absolute;z-index:3;left:5cqw;right:5cqw;bottom:26cqw;text-align:center;color:#fff;font:600 7cqw/1.15 var(--body);text-shadow:0 1px 3cqw #000b}
.cap em{display:block;font:italic 600 12cqw/1.05 'Playfair Display',serif;color:#fff;text-shadow:0 0 4cqw var(--red),0 1px 2cqw #000}
.el{position:absolute;z-index:3}
.barx{left:9cqw;right:9cqw;bottom:50cqw}
.barx .t{height:5cqw;border-radius:3cqw;background:#ffffff40;overflow:hidden}
.barx .t i{display:block;width:76%;height:100%;background:var(--red);box-shadow:0 0 4cqw var(--red)}
.barx b{display:block;text-align:right;color:#fff;font:400 13cqw/1.1 'Archivo Black',sans-serif}
.pill{position:absolute;z-index:3;padding:1.6cqw 4cqw;border-radius:6cqw;background:#ffffff2e;border:.5cqw solid #ffffff90;color:#fff;font:600 5.8cqw/1.1 var(--body);backdrop-filter:blur(2px);white-space:nowrap}
.collage{position:absolute;z-index:1;inset:7cqw 4cqw 62cqw;display:grid;grid-template-columns:repeat(4,1fr);gap:1.5cqw}
.collage i{background:linear-gradient(160deg,#30506c,#1a2e40);border-top:1.2cqw solid var(--red);border-radius:1cqw}
.collage i:nth-child(3n){background:linear-gradient(160deg,#6e8496,#3b5268)}
.rc{position:absolute;z-index:3;width:21cqw;aspect-ratio:9/14;border-radius:1.8cqw;background:linear-gradient(170deg,#6f8aa0,#21384c);border:.6cqw solid #ffffffb0;box-shadow:0 1cqw 3cqw #0008}
.rc::after{content:'SOLD';position:absolute;left:0;right:0;bottom:1.5cqw;text-align:center;font:400 3.8cqw 'Archivo Black',sans-serif;color:#fff}
.chip{position:absolute;z-index:3;padding:2.2cqw 3.6cqw;border-radius:50cqw;background:#fff;color:#0c1620;font:800 5.6cqw/1 var(--body);box-shadow:0 1cqw 3cqw #0007}
